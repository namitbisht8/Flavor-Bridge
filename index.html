<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flavor Bridge</title>
    <link rel="icon" href="/logo-icon.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <meta name="description" content="Healthy food that still tastes like home. Rebuild restricted-diet dishes with smell twins." />
    <meta property="og:title" content="Flavor Bridge" />
    <meta property="og:description" content="Healthy food that still tastes like home. Rebuild restricted-diet dishes with smell twins." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo-icon.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400;1,6..12,600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('flavor_bridge_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedFontSize = localStorage.getItem('flavor_bridge_font_size');
          if (savedFontSize) {
            document.documentElement.style.fontSize = savedFontSize;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F3F7F2] text-[#193826] font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
